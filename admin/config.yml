backend:
  name: git-gateway
  branch: main

media_folder: "photos"
public_folder: "/photos"

collections:
  - name: "gallery"
    label: "Home Gallery Photos"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Top photo 1"
            name: "top_1"
            widget: "object"
            collapsed: true
            summary: "{{fields.alt}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Description (for accessibility)", name: "alt", widget: "string"}
