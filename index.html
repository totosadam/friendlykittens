<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friendly Kittens — Admin</title>
  <meta name="robots" content="noindex">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
  <a href="/admin/editor.html" style="position:fixed;right:18px;bottom:18px;z-index:9999;background:#8a5a34;color:#fff;font:700 15px system-ui,sans-serif;padding:13px 20px;border-radius:12px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.2)">✎ Edit page text &amp; photos</a>
</body>
</html>
